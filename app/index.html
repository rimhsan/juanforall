<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - juanforall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div style="font-size: 2.2rem; color: var(--primary); margin-bottom: 8px;"><i class="ri-building-2-fill"></i></div>
            <h1>juanforall</h1>
            <p>Iriga City, Camarines Sur</p>
        </div>

        <form class="login-form" id="login-form">
            <h2 style="font-size: 1.25rem; margin-bottom: 16px;">Welcome Back</h2>
            
            <div class="form-group">
                <label for="email"><i class="ri-mail-line"></i> Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="ri-lock-line"></i> Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="display:flex; align-items:center; justify-content:center; gap:8px;"><i class="ri-login-box-line"></i> Login</button>
        </form>

        <div class="login-footer">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
