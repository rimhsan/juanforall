<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - juanforall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div style="font-size: 2.2rem; color: var(--primary); margin-bottom: 8px;"><i class="ri-building-2-fill"></i></div>
            <h1>juanforall</h1>
            <p>Iriga City, Camarines Sur</p>
        </div>

        <form class="login-form" id="signup-form">
            <h2 style="font-size: 1.25rem; margin-bottom: 16px;">Create Account</h2>
            
            <div style="display:flex; gap:12px; margin-bottom:12px;">
                <div class="form-group" style="flex:1; margin-bottom:0;">
                    <label for="firstname"><i class="ri-user-line"></i> First Name *</label>
                    <input type="text" id="firstname" placeholder="Juan" required>
                </div>
                <div class="form-group" style="flex:1; margin-bottom:0;">
                    <label for="lastname"><i class="ri-user-line"></i> Last Name *</label>
                    <input type="text" id="lastname" placeholder="Dela Cruz" required>
                </div>
            </div>

            <div class="form-group">
                <label for="purok"><i class="ri-map-pin-line"></i> Purok</label>
                <select id="purok" required style="width:100%; padding:8px 12px; border:1px solid var(--border-color); border-radius:6px;">
                    <option value="" disabled selected>Select your Purok</option>
                    <option value="Purok 1">Purok 1</option>
                    <option value="Purok 2">Purok 2</option>
                    <option value="Purok 3">Purok 3</option>
                    <option value="Purok 4">Purok 4</option>
                    <option value="Purok 5">Purok 5</option>
                    <option value="Purok 6">Purok 6</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email"><i class="ri-mail-line"></i> Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="ri-lock-line"></i> Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm-password"><i class="ri-lock-check-line"></i> Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="display:flex; align-items:center; justify-content:center; gap:8px;"><i class="ri-user-add-line"></i> Sign Up</button>
        </form>

        <div class="login-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
